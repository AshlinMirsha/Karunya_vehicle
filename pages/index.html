<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bus Attendance System - Karunya Institute of Technology and Sciences</title>
  <meta name="description" content="Secure QR-Based Bus Attendance Management System for Karunya Institute of Technology and Sciences.">

  <!-- UI Core Assets -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <!-- Fullscreen Immersive Background Video -->
  <div id="bg-video-container">
    <video id="bg-video" autoplay loop muted playsinline poster="../assets/images/karunya-logo.png">
      <source src="https://www.karunya.edu/sites/default/files/video/KarunyaWebVideoLQ.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
    <div class="video-overlay"></div>
  </div>

  <!-- Ambient Light Globs (Apple UI Style) -->
  <div class="ambient-glow glow-top-right"></div>
  <div class="ambient-glow glow-bottom-left"></div>

  <!-- Floating Glass Navbar -->
  <div id="navbar-container"></div>

  <!-- Immersive Login Card -->
  <main class="main-content">
    <div class="glass-login-card">
      <h1 class="card-title">Bus Attendance System</h1>
      <p class="card-subtitle">Secure QR Based Attendance Management</p>

      <!-- Premium Information alert block -->
      <div class="info-alert-box">
        <svg class="info-alert-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v-6m0-4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
        <div class="info-alert-text">
          Students use <strong>@karunya.edu.in</strong>. The assigned Bus 2 coordinator may use <strong>manickaraja@karunya.edu</strong>.
        </div>
      </div>

      <!-- Large 60px Premium Google Sign-In Button -->
      <button id="btn-google-login" class="btn-google-continue">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <!-- Verified Divider -->
      <div class="secure-divider">
        <i class="fa-solid fa-circle-check"></i>
        <span>Secure • Verified • Official Karunya Portal</span>
      </div>
    </div>
  </main>

  <!-- Immersive Footer -->
  <footer class="glass-footer">
    <div class="fw-semibold text-white">© Karunya Institute of Technology and Sciences</div>
    <div class="text-white-50 mt-1" style="font-size: 0.72rem;">QR Based Bus Attendance System</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="../js/login-page.js"></script>
</body>
</html>
