<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Check in — Karunya Bus Attendance</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"><link rel="stylesheet" href="../assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script></head><body class="dashboard-page checkin-page protected-page"><div id="navbar-container"></div><main class="checkin-main"><section class="checkin-card"><img class="checkin-logo" src="../Logo.png" width="54" height="60" alt="Karunya Bus Attendance"><p class="eyebrow">Bus attendance</p><h1>Check in</h1><p class="checkin-intro">Scan your bus QR code. Location verification is requested only when you submit.</p><button id="btn-start-camera" type="button" class="btn btn-glass-primary w-100 checkin-camera-button"><i class="fa-solid fa-camera me-2"></i>Scan QR with camera</button><p id="camera-status" class="checkin-status" aria-live="polite">Camera is off.</p><div class="qr-camera-frame"><video id="qr-camera-preview" class="qr-camera-preview d-none" playsinline muted></video><span class="qr-scan-line" aria-hidden="true"></span></div><div class="checkin-divider"><span>or enter a code</span></div><label class="form-label" for="input-token">Attendance code</label><input type="text" id="input-token" class="form-control font-monospace" autocomplete="off" spellcheck="false" maxlength="512" placeholder="Paste the code from your QR email"><button id="btn-submit-checkin" class="btn btn-glass-primary w-100 checkin-submit"><i class="fa-solid fa-check me-2"></i>Mark attendance</button><p class="checkin-footnote"><i class="fa-solid fa-lock me-1"></i>Secure QR and location verification</p></section></main><dialog id="checkin-success-dialog" class="checkin-success-dialog" aria-labelledby="checkin-success-title"><div class="checkin-success-icon"><i class="fa-solid fa-check"></i></div><p class="eyebrow">Attendance confirmed</p><h2 id="checkin-success-title">Check-in done</h2><p class="checkin-success-copy">Your attendance has been securely recorded.</p><dl class="checkin-success-details"><div><dt>Name</dt><dd id="checkin-success-name"></dd></div><div><dt>Register number</dt><dd id="checkin-success-register-number"></dd></div></dl><button id="btn-close-checkin-success" class="btn btn-glass-primary w-100" type="button">Done</button></dialog><script type="module">import { initCheckinPage } from '../js/qr-scanner.js'; if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initCheckinPage, { once: true }); else initCheckinPage();</script></body></html>
