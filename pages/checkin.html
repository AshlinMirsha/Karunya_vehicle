<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Check in — Karunya Bus Attendance</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"><link rel="stylesheet" href="../assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script></head><body class="dashboard-page checkin-page"><div id="navbar-container"></div><main class="checkin-main"><section class="checkin-card"><img class="checkin-logo" src="../Logo.png" width="54" height="60" alt="Karunya Bus Attendance"><p class="eyebrow">Bus attendance</p><h1>Check in</h1><p class="checkin-intro">Scan your bus QR code. Location verification is requested only when you submit.</p><button id="btn-start-camera" type="button" class="btn btn-glass-primary w-100 checkin-camera-button"><i class="fa-solid fa-camera me-2"></i>Scan QR with camera</button><p id="camera-status" class="checkin-status" aria-live="polite">Camera is off.</p><video id="qr-camera-preview" class="qr-camera-preview d-none" playsinline muted></video><div class="checkin-divider"><span>or enter a code</span></div><label class="form-label" for="input-token">Attendance code</label><input type="text" id="input-token" class="form-control font-monospace" autocomplete="off" spellcheck="false" maxlength="512" placeholder="Paste the code from your QR email"><button id="btn-submit-checkin" class="btn btn-glass-primary w-100 checkin-submit"><i class="fa-solid fa-check me-2"></i>Mark attendance</button><p class="checkin-footnote"><i class="fa-solid fa-lock me-1"></i>Secure QR and location verification</p></section></main><script type="module">import { initCheckinPage } from '../js/qr-scanner.js'; document.addEventListener('DOMContentLoaded', initCheckinPage);</script></body></html>
