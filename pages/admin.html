<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Dashboard — Karunya Bus Attendance</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../assets/css/style.css"></head><body class="dashboard-page protected-page"><div id="navbar-container"></div><main class="container-fluid px-4 py-4"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><p class="text-uppercase text-muted small mb-1">Administration</p><h1 class="h3 fw-bold mb-0">All-bus attendance centre</h1></div><span class="badge bg-warning text-dark">All buses</span></div><div class="row g-3 mb-4"><div class="col-md-3"><div class="glass-panel p-3"><div class="text-muted small text-uppercase">Students</div><div id="stat-total-students" class="fs-2 fw-bold">--</div></div></div><div class="col-md-3"><div class="glass-panel p-3"><div class="text-muted small text-uppercase">Active buses</div><div id="stat-active-buses" class="fs-2 fw-bold">--</div></div></div><div class="col-md-3"><div class="glass-panel p-3"><div class="text-muted small text-uppercase">Today's check-ins</div><div id="stat-today-attendance" class="fs-2 fw-bold">--</div></div></div><div class="col-md-3"><div class="glass-panel p-3"><div class="text-muted small text-uppercase">Filtered records</div><div id="stat-history-count" class="fs-2 fw-bold">--</div></div></div></div><section class="glass-panel p-4"><div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3"><div><h2 class="h5 fw-bold mb-1">Attendance history — all buses</h2><p class="text-muted small mb-0">Present and absent status is calculated per completed bus session.</p></div><button id="btn-clear-filters" class="btn btn-outline-secondary">Clear filters</button></div><div class="row g-3 mb-4"><div class="col-md-2"><label class="form-label small" for="filter-bus">Bus number</label><select id="filter-bus" class="form-select"></select></div><div class="col-md-3"><label class="form-label small" for="filter-search">Search student</label><input id="filter-search" type="text" class="form-control" placeholder="Name or roll no."></div><div class="col-md-3"><label class="form-label small" for="filter-date-from">From date/time</label><input id="filter-date-from" type="datetime-local" class="form-control"></div><div class="col-md-2"><label class="form-label small" for="filter-date-to">To date/time</label><input id="filter-date-to" type="datetime-local" class="form-control"></div><div class="col-md-2"><label class="form-label small" for="filter-status">Status</label><select id="filter-status" class="form-select"><option value="">Present and absent</option><option value="PRESENT">Present</option><option value="ABSENT">Absent</option></select></div></div><div class="table-responsive"><table class="table table-dark-custom align-middle mb-0"><thead><tr><th>Student</th><th>Register number</th><th>Bus</th><th>Date</th><th>Morning</th><th>Evening</th></tr></thead><tbody id="attendance-list"><tr><td colspan="7" class="text-center text-muted py-4">Loading attendance history…</td></tr></tbody></table></div></section></main><script type="module">import { initAdminDashboard } from '../js/admin.js'; if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initAdminDashboard,{once:true});else initAdminDashboard();</script></body></html>
