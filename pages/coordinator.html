<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordinator Dashboard - Karunya Bus Attendance</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="dashboard-page">

  <div id="navbar-container"></div>

  <div class="container-fluid px-4 py-3">
    <div class="row g-4">

      <!-- Left Column: Dynamic QR Generator -->
      <div class="col-lg-5">
        <div class="glass-panel p-4 h-100 text-center">
          <h4 class="fw-bold text-white mb-3"><i class="fa-solid fa-qrcode text-info me-2"></i>Dynamic Session QR Generator</h4>

          <div class="row g-2 mb-3 text-start">
            <div class="col-6">
              <label class="form-label text-muted fs-7">Select Bus</label>
              <select id="select-bus" class="form-select bg-dark text-white border-secondary">
                <option value="BUS_001">Bus K1 - Town Hall</option>
                <option value="BUS_002">Bus K2 - Gandhipuram</option>
                <option value="BUS_003">Bus K3 - Singanallur</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label text-muted fs-7">Session Shift</label>
              <select id="select-session" class="form-select bg-dark text-white border-secondary">
                <option value="Morning">Morning (5:00 AM)</option>
                <option value="Evening">Evening (3:00 PM)</option>
              </select>
            </div>
          </div>

          <button id="btn-generate-qr" class="btn btn-glass-primary w-100 mb-4">
            <i class="fa-solid fa-bolt me-2"></i>Generate Dynamic Session QR
          </button>

          <div class="qr-wrapper d-flex flex-column align-items-center justify-content-center p-3 rounded-4 bg-dark bg-opacity-50 border border-secondary" style="min-height: 250px;">
            <div id="qr-code-display">
              <div class="text-muted fs-7">Click 'Generate' to load secure dynamic QR code</div>
            </div>
            <div id="qr-url-text" class="w-100"></div>
          </div>

          <small class="text-muted d-block mt-3 fs-8">
            <i class="fa-solid fa-shield-halved text-success me-1"></i>QR tokens expire dynamically every 30 minutes for security.
          </small>
        </div>
      </div>

      <!-- Right Column: Live Checked-in Students List -->
      <div class="col-lg-7">
        <div class="glass-panel p-4 h-100">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold text-white mb-0">
              <i class="fa-solid fa-users me-2 text-info"></i>Live Attendance Count
            </h5>
            <span class="badge bg-success fs-6 px-3 py-2">
              Total Present: <span id="present-count">0</span>
            </span>
          </div>

          <div class="table-responsive">
            <table class="table table-dark-custom mb-0">
              <thead>
                <tr>
                  <th>Student Name</th>
                  <th>Reg Number</th>
                  <th>Check-In Time</th>
                  <th>Bus No</th>
                  <th>Verification</th>
                </tr>
              </thead>
              <tbody id="coordinator-student-list">
                <tr>
                  <td colspan="5" class="text-center text-muted py-4">No attendance registered for this session yet.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initCoordinatorDashboard } from '../js/coordinator.js';
    document.addEventListener('DOMContentLoaded', initCoordinatorDashboard);
  </script>
</body>
</html>
