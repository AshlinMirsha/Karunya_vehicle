<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal - Karunya Bus Attendance</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="pt-5 mt-4">

  <!-- Background Video -->
  <div id="bg-video-container">
    <video id="bg-video" autoplay loop muted playsinline>
      <source src="https://www.karunya.edu/sites/default/files/video/KarunyaWebVideoLQ.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
  </div>

  <div id="navbar-container"></div>

  <div class="container py-4">
    <!-- Student Header Info Panel -->
    <div class="glass-panel p-4 mb-4">
      <div id="student-profile">
        <div class="placeholder-glow">
          <span class="placeholder col-12"></span>
        </div>
      </div>
    </div>

    <!-- Quick Scan Attendance Box -->
    <div class="row mb-4">
      <div class="col-md-12">
        <div class="glass-panel p-4 text-center">
          <h4 class="fw-bold text-white mb-2"><i class="fa-solid fa-qrcode text-info me-2"></i>Mark Attendance</h4>
          <p class="text-muted mb-3">Scan your assigned bus QR code using camera or enter dynamic token to check-in.</p>
          <a href="/checkin" class="btn btn-glass-primary px-4 py-2">
            <i class="fa-solid fa-camera me-2"></i>Open QR Scanner / Check-in Portal
          </a>
        </div>
      </div>
    </div>

    <!-- Attendance History Table -->
    <div class="glass-panel p-4">
      <h5 class="fw-bold text-white mb-3"><i class="fa-solid fa-clock-rotate-left me-2 text-info"></i>Attendance Log History</h5>
      <div class="table-responsive">
        <table class="table table-dark-custom mb-0">
          <thead>
            <tr>
              <th>Date & Time</th>
              <th>Session</th>
              <th>Bus No</th>
              <th>GPS Location</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="attendance-history">
            <tr>
              <td colspan="5" class="text-center text-muted py-3">Loading history records...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initStudentDashboard } from '../js/student.js';
    document.addEventListener('DOMContentLoaded', initStudentDashboard);
  </script>
</body>
</html>
