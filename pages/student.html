<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal - Karunya Bus Attendance</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="dashboard-page student-dashboard protected-page">

  <div id="navbar-container"></div>

  <main class="container student-dashboard-content py-4">
    <!-- Student Header Info Panel -->
    <section class="glass-panel student-profile-panel p-4 mb-4">
      <div id="student-profile">
        <div class="placeholder-glow">
          <span class="placeholder col-12"></span>
        </div>
      </div>
    </section>

    <!-- Quick Scan Attendance Box -->
    <div class="row mb-4">
      <div class="col-md-12">
        <section class="glass-panel attendance-action-panel p-4">
          <div class="attendance-action-copy">
            <span class="student-icon-bubble" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h3A1.5 1.5 0 0 1 10 5.5v3A1.5 1.5 0 0 1 8.5 10h-3A1.5 1.5 0 0 1 4 8.5zm10 0A1.5 1.5 0 0 1 15.5 4h3A1.5 1.5 0 0 1 20 5.5v3A1.5 1.5 0 0 1 18.5 10h-3A1.5 1.5 0 0 1 14 8.5zM4 15.5A1.5 1.5 0 0 1 5.5 14h3a1.5 1.5 0 0 1 1.5 1.5v3A1.5 1.5 0 0 1 8.5 20h-3A1.5 1.5 0 0 1 4 18.5zm10 0a1.5 1.5 0 0 1 1.5-1.5h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3a1.5 1.5 0 0 1-1.5-1.5z"/></svg></span>
            <div><p class="student-eyebrow">Today’s ride</p><h1>Mark your attendance</h1><p>Scan your assigned bus QR code or use your secure check-in code.</p></div>
          </div>
          <a href="/checkin" id="btn-scan-qr-code" class="btn btn-glass-primary attendance-cta px-4 py-2"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h3A1.5 1.5 0 0 1 10 5.5v3A1.5 1.5 0 0 1 8.5 10h-3A1.5 1.5 0 0 1 4 8.5zm10 0A1.5 1.5 0 0 1 15.5 4h3A1.5 1.5 0 0 1 20 5.5v3A1.5 1.5 0 0 1 18.5 10h-3A1.5 1.5 0 0 1 14 8.5zM4 15.5A1.5 1.5 0 0 1 5.5 14h3a1.5 1.5 0 0 1 1.5 1.5v3A1.5 1.5 0 0 1 8.5 20h-3A1.5 1.5 0 0 1 4 18.5zm10 0a1.5 1.5 0 0 1 1.5-1.5h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3a1.5 1.5 0 0 1-1.5-1.5z"/></svg>Scan QR Code</a>
        </section>
      </div>
    </div>

    <!-- Attendance History Table -->
    <section class="glass-panel attendance-history-panel p-4">
      <div class="history-heading"><span class="student-icon-bubble small" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 7v5l3 2m6-2a9 9 0 1 1-9-9 9 9 0 0 1 9 9z"/></svg></span><div><p class="student-eyebrow">Your record</p><h2>Attendance history</h2></div></div>
      <div class="table-responsive">
        <table class="table table-dark-custom mb-0">
          <thead>
            <tr>
              <th>Date & Time</th>
              <th>Session</th>
              <th>Bus No</th>
              <th>GPS Location</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="attendance-history">
            <tr>
              <td colspan="5" class="text-center text-muted py-3">Loading history records...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <button id="btn-back-to-top" type="button" aria-label="Back to top" title="Back to top"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initStudentDashboard } from '../js/student.js';
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initStudentDashboard, { once: true });
    else initStudentDashboard();
  </script>
</body>
</html>
