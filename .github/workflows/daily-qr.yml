name: Daily QR Email Dispatch

on:
  schedule:
    # Morning: 5:00 AM IST = 23:30 UTC (previous day)
    - cron: '30 23 * * *'
    # Evening: 3:00 PM IST = 09:30 UTC
    - cron: '30 9 * * *'
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      session_type:
        description: 'Session type to send'
        required: true
        default: 'Morning'
        type: choice
        options:
          - Morning
          - Evening

jobs:
  send-qr-email:
    name: Send QR Email to Bus Coordinators
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Determine session type
        id: session
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.session_type }}" = "Evening" ]; then
              echo 'types=["Evening"]' >> $GITHUB_OUTPUT
            else
              echo 'types=["Morning"]' >> $GITHUB_OUTPUT
            fi
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "23" ]; then
              echo 'types=["Morning"]' >> $GITHUB_OUTPUT
            else
              echo 'types=["Evening"]' >> $GITHUB_OUTPUT
            fi
          fi

      - name: Call daily-qr Edge Function
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://kkbzofddkfusblyplnca.supabase.co/functions/v1/daily-qr" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"sessionTypes": ${{ steps.session.outputs.types }}}' \
            --max-time 60)

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Status: $HTTP_STATUS"
          echo "$BODY" | python3 -m json.tool || echo "$BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Edge Function returned HTTP $HTTP_STATUS"
            exit 1
          fi
